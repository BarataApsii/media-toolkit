version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: media-toolkit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-media_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-media_pass}
      POSTGRES_DB: ${POSTGRES_DB:-media_toolkit}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: media-toolkit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
